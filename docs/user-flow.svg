<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1e1e3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ce0d2"/>
      <stop offset="100%" stop-color="#4db8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">How to Use JobRelay</text>
  <text x="450" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8892b0">Three steps from setup to your first scan — all in plain English</text>

  <!-- Step 1 -->
  <rect x="30" y="100" width="260" height="380" rx="12" fill="url(#card)" stroke="#333366" stroke-width="1"/>
  <circle cx="160" cy="135" r="18" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
  <text x="160" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">1</text>
  <text x="160" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Say Hello</text>
  <text x="160" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8892b0">Open Notion AI &gt; Select JobRelay</text>

  <!-- Chat mockup step 1 -->
  <rect x="50" y="210" width="220" height="250" rx="8" fill="#1a1a2e" stroke="#333366" stroke-width="1"/>
  <rect x="62" y="225" width="140" height="28" rx="14" fill="#2d4a3e" stroke="#5ce0d2" stroke-width="0.5"/>
  <text x="80" y="243" font-family="system-ui, sans-serif" font-size="10" fill="#5ce0d2">What can you do?</text>
  <rect x="62" y="265" width="196" height="90" rx="8" fill="#252545"/>
  <text x="72" y="282" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">I can help you with:</text>
  <text x="72" y="298" font-family="system-ui, sans-serif" font-size="9" fill="#8892b0">- Scan job boards for matches</text>
  <text x="72" y="312" font-family="system-ui, sans-serif" font-size="9" fill="#8892b0">- Generate tailored resumes</text>
  <text x="72" y="326" font-family="system-ui, sans-serif" font-size="9" fill="#8892b0">- Research companies &amp; salaries</text>
  <text x="72" y="340" font-family="system-ui, sans-serif" font-size="9" fill="#8892b0">- Track your pipeline</text>
  <rect x="62" y="365" width="196" height="24" rx="4" fill="#252545"/>
  <text x="72" y="381" font-family="system-ui, sans-serif" font-size="9" fill="#5ce0d2">Want me to set up your profile?</text>

  <!-- Arrow 1→2 -->
  <path d="M295 290 L315 290" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <rect x="320" y="100" width="260" height="380" rx="12" fill="url(#card)" stroke="#333366" stroke-width="1"/>
  <circle cx="450" cy="135" r="18" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
  <text x="450" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">2</text>
  <text x="450" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Set Preferences</text>
  <text x="450" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8892b0">Answer simple questions in chat</text>

  <!-- Chat mockup step 2 -->
  <rect x="340" y="210" width="220" height="250" rx="8" fill="#1a1a2e" stroke="#333366" stroke-width="1"/>
  <rect x="352" y="225" width="196" height="56" rx="8" fill="#252545"/>
  <text x="362" y="242" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">What roles are you targeting?</text>
  <text x="362" y="256" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">What locations work for you?</text>
  <text x="362" y="270" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">What's your minimum salary?</text>

  <rect x="392" y="292" width="156" height="28" rx="14" fill="#2d4a3e" stroke="#5ce0d2" stroke-width="0.5"/>
  <text x="410" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#5ce0d2">ML Engineer, NYC, $200k+</text>

  <rect x="352" y="332" width="196" height="48" rx="8" fill="#252545"/>
  <text x="362" y="349" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">Got it! You're set up for:</text>
  <text x="362" y="363" font-family="system-ui, sans-serif" font-size="9" fill="#5ce0d2">ML Engineer roles in NYC, $200k+</text>
  <text x="362" y="377" font-family="system-ui, sans-serif" font-size="9" fill="#8892b0">Autopilot mode (I prep, you approve)</text>

  <rect x="352" y="392" width="196" height="24" rx="4" fill="#252545"/>
  <text x="362" y="408" font-family="system-ui, sans-serif" font-size="9" fill="#5ce0d2">Ready to scan? Just say the word.</text>

  <!-- Arrow 2→3 -->
  <path d="M585 290 L605 290" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Step 3 -->
  <rect x="610" y="100" width="260" height="380" rx="12" fill="url(#card)" stroke="#333366" stroke-width="1"/>
  <circle cx="740" cy="135" r="18" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
  <text x="740" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">3</text>
  <text x="740" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Scan &amp; Track</text>
  <text x="740" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8892b0">Results land in your Command Center</text>

  <!-- Results mockup step 3 -->
  <rect x="630" y="210" width="220" height="250" rx="8" fill="#1a1a2e" stroke="#333366" stroke-width="1"/>
  <rect x="642" y="225" width="100" height="28" rx="14" fill="#2d4a3e" stroke="#5ce0d2" stroke-width="0.5"/>
  <text x="660" y="243" font-family="system-ui, sans-serif" font-size="10" fill="#5ce0d2">Scan for jobs</text>

  <rect x="642" y="265" width="196" height="28" rx="6" fill="#252545"/>
  <text x="652" y="278" font-family="system-ui, sans-serif" font-size="8" fill="#8892b0">Scanning Dice, Indeed...</text>
  <rect x="652" y="284" width="120" height="3" rx="1.5" fill="#333366"/>
  <rect x="652" y="284" width="90" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Job results -->
  <rect x="642" y="302" width="196" height="32" rx="6" fill="#1e3a2e" stroke="#2ecc71" stroke-width="0.5"/>
  <text x="652" y="316" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#2ecc71">92</text>
  <text x="672" y="316" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">Sr ML Engineer — Anthropic</text>
  <text x="652" y="329" font-family="system-ui, sans-serif" font-size="8" fill="#8892b0">Resume generated, ready for review</text>

  <rect x="642" y="340" width="196" height="32" rx="6" fill="#1e3a2e" stroke="#2ecc71" stroke-width="0.5"/>
  <text x="652" y="354" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#2ecc71">85</text>
  <text x="672" y="354" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">ML Platform — Stripe</text>
  <text x="652" y="367" font-family="system-ui, sans-serif" font-size="8" fill="#8892b0">Strong match, materials ready</text>

  <rect x="642" y="378" width="196" height="32" rx="6" fill="#252545" stroke="#f39c12" stroke-width="0.5"/>
  <text x="652" y="392" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#f39c12">67</text>
  <text x="672" y="392" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">Data Scientist — McKinsey</text>
  <text x="652" y="405" font-family="system-ui, sans-serif" font-size="8" fill="#8892b0">Moderate match, logged for review</text>

  <rect x="642" y="418" width="196" height="32" rx="6" fill="#252545" stroke="#333366" stroke-width="0.5"/>
  <text x="652" y="432" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8892b0">41</text>
  <text x="672" y="432" font-family="system-ui, sans-serif" font-size="9" fill="#c8d6e5">Junior Analyst — Deloitte</text>
  <text x="652" y="445" font-family="system-ui, sans-serif" font-size="8" fill="#8892b0">Below threshold, skipped</text>

  <!-- Footer -->
  <text x="450" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5ce0d2">All results tracked in your Career Command Center database</text>
</svg>