<svg viewBox="0 0 520 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>JobRelay Agent Chat — Notion AI Interaction</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .window-title { font-size: 12px; fill: #1a1a2e; font-weight: 500; }
  </style>

  <!-- Window chrome -->
  <rect x="0" y="0" width="520" height="580" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="0" y="0" width="520" height="36" rx="12" fill="#f9fafb"/>
  <rect x="0" y="24" width="520" height="12" fill="#f9fafb"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="260" y="22" text-anchor="middle" class="window-title">Notion AI — JobRelay Agent</text>

  <!-- Agent header -->
  <rect x="20" y="48" width="480" height="40" rx="8" fill="#f8fafc"/>
  <circle cx="46" cy="68" r="14" fill="#1e293b"/>
  <text x="46" y="73" text-anchor="middle" style="font-size:12px;fill:#fff;font-weight:700">JR</text>
  <text x="70" y="64" style="font-size:13px;fill:#1f2937;font-weight:600">JobRelay</text>
  <text x="70" y="78" style="font-size:10px;fill:#6b7280">Career Intelligence Agent · 5 tools available</text>
  <circle cx="476" cy="68" r="5" fill="#10b981"/>

  <!-- User message -->
  <rect x="140" y="108" width="360" height="36" rx="16" fill="#1e293b"/>
  <text x="160" y="130" style="font-size:12px;fill:#fff">Scan for senior AI roles in NYC, remote OK</text>

  <!-- Agent response -->
  <rect x="20" y="160" width="440" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tool call badge -->
  <rect x="32" y="170" width="80" height="18" rx="9" fill="#ede9fe"/>
  <text x="72" y="182" text-anchor="middle" style="font-size:9px;fill:#7c3aed;font-weight:600">scanJobs</text>
  <rect x="118" y="170" width="56" height="18" rx="9" fill="#d1fae5"/>
  <text x="146" y="182" text-anchor="middle" style="font-size:9px;fill:#065f46;font-weight:600">Done ✓</text>

  <text x="32" y="206" style="font-size:12px;fill:#1f2937;font-weight:500">Found 12 matching roles. Here's the top 3:</text>

  <!-- Result 1 -->
  <rect x="32" y="216" width="416" height="32" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="44" y="236" style="font-size:11px;fill:#1f2937;font-weight:500">Sr. AI/ML Engineer — Anthropic</text>
  <rect x="340" y="224" width="36" height="16" rx="8" fill="#d1fae5"/>
  <text x="358" y="235" text-anchor="middle" style="font-size:9px;fill:#065f46;font-weight:700">94</text>
  <rect x="382" y="224" width="56" height="16" rx="8" fill="#dbeafe"/>
  <text x="410" y="235" text-anchor="middle" style="font-size:8px;fill:#1d4ed8;font-weight:600">DREAM</text>

  <!-- Result 2 -->
  <rect x="32" y="252" width="416" height="32" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="44" y="272" style="font-size:11px;fill:#1f2937;font-weight:500">Staff Engineer, Platform — Stripe</text>
  <rect x="340" y="260" width="36" height="16" rx="8" fill="#d1fae5"/>
  <text x="358" y="271" text-anchor="middle" style="font-size:9px;fill:#065f46;font-weight:700">87</text>
  <rect x="382" y="260" width="48" height="16" rx="8" fill="#dcfce7"/>
  <text x="406" y="271" text-anchor="middle" style="font-size:8px;fill:#166534;font-weight:600">HIGH</text>

  <!-- Result 3 -->
  <rect x="32" y="288" width="416" height="32" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
  <text x="44" y="308" style="font-size:11px;fill:#1f2937;font-weight:500">Head of AI Strategy — McKinsey</text>
  <rect x="340" y="296" width="36" height="16" rx="8" fill="#d1fae5"/>
  <text x="358" y="307" text-anchor="middle" style="font-size:9px;fill:#065f46;font-weight:700">82</text>
  <rect x="382" y="296" width="48" height="16" rx="8" fill="#dcfce7"/>
  <text x="406" y="307" text-anchor="middle" style="font-size:8px;fill:#166534;font-weight:600">HIGH</text>

  <!-- Agent follow-up -->
  <rect x="20" y="346" width="440" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="32" y="356" width="90" height="18" rx="9" fill="#ede9fe"/>
  <text x="77" y="368" text-anchor="middle" style="font-size:9px;fill:#7c3aed;font-weight:600">tailorResume</text>
  <rect x="128" y="356" width="72" height="18" rx="9" fill="#fef3c7"/>
  <text x="164" y="368" text-anchor="middle" style="font-size:9px;fill:#92400e;font-weight:600">Running...</text>

  <text x="32" y="392" style="font-size:12px;fill:#1f2937">Generating ATS-optimized resume for Anthropic role...</text>
  <text x="32" y="410" style="font-size:11px;fill:#6b7280">Extracting keywords: MLOps, RLHF, distributed systems,</text>
  <text x="32" y="422" style="font-size:11px;fill:#6b7280">transformer architecture, Python, production ML</text>

  <!-- User message 2 -->
  <rect x="200" y="442" width="300" height="36" rx="16" fill="#1e293b"/>
  <text x="220" y="464" style="font-size:12px;fill:#fff">Set automation to Autopilot for 80+</text>

  <!-- Agent confirmation -->
  <rect x="20" y="492" width="440" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="32" y="502" width="100" height="18" rx="9" fill="#ede9fe"/>
  <text x="82" y="514" text-anchor="middle" style="font-size:9px;fill:#7c3aed;font-weight:600">configureAgent</text>
  <rect x="138" y="502" width="56" height="18" rx="9" fill="#d1fae5"/>
  <text x="166" y="514" text-anchor="middle" style="font-size:9px;fill:#065f46;font-weight:600">Done ✓</text>
  <text x="32" y="536" style="font-size:12px;fill:#1f2937">✅ Autopilot enabled for scores ≥80. I'll generate materials</text>
  <text x="32" y="550" style="font-size:12px;fill:#1f2937">automatically and ping you on Slack before applying.</text>

  <!-- Typing indicator area -->
  <rect x="20" y="556" width="480" height="20" rx="4" fill="transparent"/>
  <text x="30" y="570" style="font-size:10px;fill:#9ca3af">Ask JobRelay anything...</text>
</svg>
