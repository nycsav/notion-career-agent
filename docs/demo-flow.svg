<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>JobRelay — End-to-End User Flow</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .flow-title { font-size: 14px; font-weight: 700; fill: #1a1a2e; }
    .flow-sub { font-size: 10px; fill: #6b7280; }
    .node-label { font-size: 11px; font-weight: 600; fill: #fff; }
    .node-desc { font-size: 9px; fill: rgba(255,255,255,0.85); }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#flow-arrow); }
    .time-label { font-size: 9px; fill: #10b981; font-weight: 600; }
    .section-label { font-size: 9px; fill: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  </style>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" class="flow-title">User Experience Flow — From Setup to Applied</text>
  <text x="450" y="44" text-anchor="middle" class="flow-sub">Complete pipeline runs in under 60 seconds per job</text>

  <!-- Section labels -->
  <text x="130" y="70" text-anchor="middle" class="section-label">Setup (once)</text>
  <text x="450" y="70" text-anchor="middle" class="section-label">Automated Pipeline</text>
  <text x="800" y="70" text-anchor="middle" class="section-label">Human Review</text>

  <!-- Node 1: User configures -->
  <rect x="30" y="85" width="120" height="70" rx="10" fill="#1e293b"/>
  <text x="90" y="112" text-anchor="middle" class="node-label">Configure</text>
  <text x="90" y="127" text-anchor="middle" class="node-desc">Upload resume</text>
  <text x="90" y="139" text-anchor="middle" class="node-desc">Set preferences</text>
  <text x="90" y="151" text-anchor="middle" class="node-desc">Choose tier</text>

  <!-- Arrow -->
  <path d="M 150 120 L 182 120" class="arrow"/>

  <!-- Node 2: Ask agent -->
  <rect x="182" y="85" width="120" height="70" rx="10" fill="#3b82f6"/>
  <text x="242" y="112" text-anchor="middle" class="node-label">Ask Agent</text>
  <text x="242" y="127" text-anchor="middle" class="node-desc">"Scan for AI roles"</text>
  <text x="242" y="139" text-anchor="middle" class="node-desc">Natural language</text>
  <text x="242" y="151" text-anchor="middle" class="node-desc">in Notion chat</text>

  <!-- Arrow -->
  <path d="M 302 120 L 334 120" class="arrow"/>
  <text x="318" y="112" text-anchor="middle" class="time-label">~5s</text>

  <!-- Node 3: Discover -->
  <rect x="334" y="85" width="105" height="70" rx="10" fill="#8b5cf6"/>
  <text x="386" y="112" text-anchor="middle" class="node-label">Discover</text>
  <text x="386" y="127" text-anchor="middle" class="node-desc">Scan Dice +</text>
  <text x="386" y="139" text-anchor="middle" class="node-desc">Indeed via MCP</text>
  <text x="386" y="151" text-anchor="middle" class="node-desc">Filter matches</text>

  <!-- Arrow -->
  <path d="M 439 120 L 462 120" class="arrow"/>
  <text x="450" y="112" text-anchor="middle" class="time-label">~8s</text>

  <!-- Node 4: Score -->
  <rect x="462" y="85" width="105" height="70" rx="10" fill="#7c3aed"/>
  <text x="514" y="112" text-anchor="middle" class="node-label">Score</text>
  <text x="514" y="127" text-anchor="middle" class="node-desc">Claude Haiku</text>
  <text x="514" y="139" text-anchor="middle" class="node-desc">0-100 fit rating</text>
  <text x="514" y="151" text-anchor="middle" class="node-desc">+ gap analysis</text>

  <!-- Arrow -->
  <path d="M 567 120 L 590 120" class="arrow"/>
  <text x="578" y="112" text-anchor="middle" class="time-label">~12s</text>

  <!-- Node 5: Tailor -->
  <rect x="590" y="85" width="105" height="70" rx="10" fill="#059669"/>
  <text x="642" y="112" text-anchor="middle" class="node-label">Tailor</text>
  <text x="642" y="127" text-anchor="middle" class="node-desc">Claude Sonnet</text>
  <text x="642" y="139" text-anchor="middle" class="node-desc">ATS resume +</text>
  <text x="642" y="151" text-anchor="middle" class="node-desc">cover letter</text>

  <!-- Arrow -->
  <path d="M 695 120 L 718 120" class="arrow"/>
  <text x="706" y="112" text-anchor="middle" class="time-label">~30s</text>

  <!-- Node 6: Approve -->
  <rect x="718" y="85" width="120" height="70" rx="10" fill="#ec4899"/>
  <text x="778" y="112" text-anchor="middle" class="node-label">Approve</text>
  <text x="778" y="127" text-anchor="middle" class="node-desc">Slack notification</text>
  <text x="778" y="139" text-anchor="middle" class="node-desc">Review materials</text>
  <text x="778" y="151" text-anchor="middle" class="node-desc">One-click apply</text>

  <!-- Second row: What gets produced -->
  <rect x="30" y="195" width="840" height="105" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="216" style="font-size:10px;font-weight:600;fill:#374151">What Gets Produced</text>

  <!-- Output cards -->
  <rect x="50" y="228" width="150" height="56" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="125" y="250" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#5b21b6">Scored Job Cards</text>
  <text x="125" y="265" text-anchor="middle" style="font-size:9px;fill:#7c3aed">Fit score + reasoning</text>
  <text x="125" y="277" text-anchor="middle" style="font-size:9px;fill:#7c3aed">Priority + ATS keywords</text>

  <rect x="220" y="228" width="150" height="56" rx="8" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="295" y="250" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#065f46">Tailored Resume</text>
  <text x="295" y="265" text-anchor="middle" style="font-size:9px;fill:#059669">Role-specific bullets</text>
  <text x="295" y="277" text-anchor="middle" style="font-size:9px;fill:#059669">Keyword-optimized</text>

  <rect x="390" y="228" width="150" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="465" y="250" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#1e40af">Cover Letter</text>
  <text x="465" y="265" text-anchor="middle" style="font-size:9px;fill:#3b82f6">Company-personalized</text>
  <text x="465" y="277" text-anchor="middle" style="font-size:9px;fill:#3b82f6">Value-prop focused</text>

  <rect x="560" y="228" width="150" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="635" y="250" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#92400e">Pipeline Tracker</text>
  <text x="635" y="265" text-anchor="middle" style="font-size:9px;fill:#d97706">Status progression</text>
  <text x="635" y="277" text-anchor="middle" style="font-size:9px;fill:#d97706">Linked materials</text>

  <rect x="730" y="228" width="120" height="56" rx="8" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="790" y="250" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#9d174d">Slack Alert</text>
  <text x="790" y="265" text-anchor="middle" style="font-size:9px;fill:#ec4899">Action required</text>
  <text x="790" y="277" text-anchor="middle" style="font-size:9px;fill:#ec4899">One-tap approve</text>
</svg>
